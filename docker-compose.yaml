services:
  db:
    image: postgres:16-alpine
    container_name: 69-s1-db
    ports:
      - 127.0.0.1:${POSTGRES_PORT}:5432
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./data/data:/var/lib/postgresql/data
  admin:
    image: dpage/pgadmin4
    container_name: 69-s1-admin
    ports:
      - 127.0.0.1:${PGADMIN_DEFAULT_PORT}:80
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
  app:
    image: prawee/strapi
    container_name: 69-s1-app
    ports:
      - 127.0.0.1:${APP_PORT}:1337
    volumes:
      - ./config/plugins.js:/opt/app/config/plugins.js
      - ./strapi-extras/node_modules/@strapi/provider-email-nodemailer:/opt/node_modules/@strapi/provider-email-nodemailer
      - ./strapi-extras/node_modules/nodemailer:/opt/node_modules/nodemailer
    environment:
      - DATABASE_CLIENT=${DATABASE_CLIENT}
      - DATABASE_NAME=${DATABASE_NAME}
      - DATABASE_HOST=${DATABASE_HOST}
      - DATABASE_PORT=${DATABASE_PORT}
      - DATABASE_USERNAME=${DATABASE_USERNAME}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - APP_KEYS=${APP_KEYS}
      - API_TOKEN_SALT=${API_TOKEN_SALT}
      - ADMIN_JWT_SECRET=${ADMIN_JWT_SECRET}
      - TRANSFER_TOKEN_SALT=${TRANSFER_TOKEN_SALT}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}